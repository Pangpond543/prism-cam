[package]
name = "prism-cam"
version = "1.3.0"
description = "Prism Cam — glass camera studio with a virtual camera output"
edition = "2021"
license = "MIT"

[workspace]
members = ["vcam"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
# phone camera: HTTPS page on the home network (self-signed certificate made on this PC), QR code, network addresses
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
# now playing (Windows media controls) for the lyrics layer — a separate copy of the crate on purpose: adding WinRT
# features to the 0.61 one above would change how prism_vcam.dll (same workspace) is built, and a changed DLL makes
# the app ask the user to install the virtual camera again
winrt = { package = "windows", version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Media_MediaFoundation",
  "Win32_UI_Shell",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# plain `cargo build` always embeds the renderer (same as `tauri build`)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
