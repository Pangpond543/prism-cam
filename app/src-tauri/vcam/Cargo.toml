[package]
name = "prism-vcam"
version = "1.0.0"
description = "Prism Cam virtual camera — Media Foundation source loaded by the Windows camera service"
edition = "2021"
license = "MIT"

[lib]
name = "prism_vcam"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Variant",
  "Win32_Media_MediaFoundation",
  "Win32_Media_KernelStreaming",
] }
windows-core = "0.61"
